<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | mokhaLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 8vw, 58px);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #1a1a1a;
            color: #fafafa;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        @media (max-width: 640px) {
            .button-group {
                flex-direction: column;
            }

            a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <p class="error-code">404 • Page not found</p>
            <h1>We couldn&apos;t find that page.</h1>
            <p>The link may be broken, the page may have been moved, or the address may be incorrect. Let&apos;s get you back on track.</p>
            <div class="button-group">
                <a href="/" class="btn-primary">Back to Home</a>
                <a href="/products" class="btn-secondary">Shop Products</a>
            </div>
        </div>
    </div>
</body>
</html>
